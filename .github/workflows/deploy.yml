# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a newer push waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Installs with the committed lockfile (frozen in CI), runs `pnpm run build`
      # and uploads dist/ as the Pages artifact. pnpm 11 honors pnpm-workspace.yaml
      # (7-day release quarantine, trust policy, allowBuilds).
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          package-manager: pnpm@11

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
