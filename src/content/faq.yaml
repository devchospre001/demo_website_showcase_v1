- id: patio-cost
  question: How much does a paver patio cost?
  answer: Most of our patios land between $12,000 and $45,000, depending on size, material and site prep. After the design visit you get one fixed, written price.
  shortAnswer: Most land between $12,000 and $45,000. You get one fixed, written price after the design visit.
